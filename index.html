<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>John &amp; TJ</title>
<meta name="description" content="John and TJ are getting married. Our wedding website is on its way." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #faf6f0;
    --ink: #2e2a26;
    --gold: #b08d57;
    --line: #e4dcd0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    text-align: center;
  }
  .photo-frame {
    width: 220px;
    height: 220px;
    margin: 0 auto 32px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .monogram {
    font-family: 'Playfair Display', serif;
    font-weight: 500;
    font-size: 44px;
    color: var(--gold);
    letter-spacing: 2px;
  }
  .ampersand {
    font-style: italic;
    font-size: 28px;
    opacity: 0.6;
    margin: 0 4px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: clamp(32px, 7vw, 48px);
    margin: 0 0 12px;
    letter-spacing: 0.5px;
  }
  h1 .amp {
    font-style: italic;
    font-weight: 500;
    color: var(--gold);
    padding: 0 8px;
  }
  .divider {
    width: 48px;
    height: 1px;
    background: var(--gold);
    margin: 20px auto;
  }
  p.tagline {
    font-size: 16px;
    line-height: 1.6;
    color: #6b6259;
    margin: 0 0 8px;
  }
  p.small {
    font-size: 13px;
    color: #a39a8d;
    margin-top: 28px;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="photo-frame">
      <!--
        To add the couple's photo: replace the line below with
        <img src="photo.jpg" alt="John and TJ" />
        and commit photo.jpg alongside this file.
      -->
      <span class="monogram">J<span class="ampersand">&amp;</span>T</span>
    </div>
    <h1>John <span class="amp">&amp;</span> TJ</h1>
    <div class="divider"></div>
    <p class="tagline">We're getting married!</p>
    <p class="tagline">Our wedding website is on its way — check back soon for details.</p>
    <p class="small">johnandtj.com</p>
  </div>
</body>
</html>
